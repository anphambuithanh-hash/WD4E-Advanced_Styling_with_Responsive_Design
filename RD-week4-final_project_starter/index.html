<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Final Project</title>
  <link rel="stylesheet" href="css/style.css">
</head>

<body>
  <header>
    <h1 id="top">Cloudscapes Gallery</h1>
  </header>

  <main>
    <p>Welcome to our curated collection of stunning sky views and unique cloud formations </p>

    <p>Explore nine unique visuals capturing various times of day.</p>
    
    <div class="grid">
        <figure>
          <img src="images1/bluesky1.jpg" alt="Evening sky over the sea with scattered clouds catching golden sunlight" width="200">
          <figcaption>Evening Horizon</figcaption>
        </figure>
        <figure>
          <img src="images1/bluesky2.jpg" alt="Wet sandy beach reflecting light-colored clouds in calm ocean water" width="200">
          <figcaption>Beach Reflection</figcaption>
        </figure>
        <figure>
          <img src="images1/bluesky3.jpg" alt="Aerial view above a deep blue cloud layer under bright sunlight" width="200">
          <figcaption>Above the Clouds</figcaption>
        </figure>
        <figure>
          <img src="images1/bluesky4.jpg" alt="White puffy clouds perfectly mirrored on a massive flat salt plain" width="200">
          <figcaption>Salt Flat Mirror</figcaption>
        </figure>
        <figure>
          <img src="images1/bluesky5.jpg" alt="Towering white cumulus cloud against a deep blue upper atmosphere" width="200">
          <figcaption>Towering Cumulus</figcaption>
        </figure>
        <figure>
          <img src="images1/bluesky6.jpg" alt="Massive storm cloud formation rising over open blue ocean water" width="200">
          <figcaption>Ocean Storm Front</figcaption>
        </figure>
        <figure>
          <img src="images1/bluesky7.jpg" alt="Fluffy white clouds hovering low over green fields and distant mountains" width="200">
          <figcaption>Mountain Valley Clouds</figcaption>
        </figure>
        <figure>
          <img src="images1/bluesky8.jpg" alt="Rippled wave-like cloud patterns stretched across a bright blue sky" width="200">
          <figcaption>Rippled Cloud Waves</figcaption>
        </figure>
        <figure>
          <img src="images1/bluesky9.jpg" alt="Wavy undulatus asperatus clouds hovering over a silhouette mountain range" width="200">
          <figcaption>Asperatus Formations</figcaption>
        </figure>
    </div>
  </main>

  <footer>
    <a href="#top">Jump to the Top</a>
  </footer>
</body>

</html>
